  "add or change a service/data": [03-data-and-apis.md, 13-code-and-test-map.md]
  "wire server auth or sync": [03-data-and-apis.md, 06-agent-packets.md (T-201..T-203), 07-risk-register.md]
  "ship to store": [11-checklists.md, 05-build-plan.md, SOURCE-OF-TRUTH.md]
  "fix a bug / regression": [09-correction-preflight.md, 13-code-and-test-map.md]

chains:
  ship_mvp: [05-build-plan.md, 11-checklists.md, 08-verification-plan.md]
  server_integration: [03-data-and-apis.md, 06-agent-packets.md, 08-verification-plan.md, 07-risk-register.md]
  ui_packet: [10-page-by-page.md, 12-screen-acceptance-matrix.md, 13-code-and-test-map.md]

