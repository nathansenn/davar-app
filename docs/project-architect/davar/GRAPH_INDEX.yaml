  mission: docs/project-architect/davar/MISSION.md
  source_of_truth: docs/project-architect/davar/SOURCE-OF-TRUTH.md
  store_prep:
    - docs/app-store-description.md
    - docs/play-store-description.md
    - docs/screenshots-needed.md
    - docs/deployment.md

divisions:
